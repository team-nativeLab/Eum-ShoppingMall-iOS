name: iOS checks
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: |
          if find Projects -name '*.swift' -print -quit | grep -q .; then
            swiftlint lint --strict
          else
            echo 'No Swift sources yet; skipping SwiftLint.'
          fi
  tuist:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Tuist
        run: brew install tuist
      - name: Initialize CoreSimulator
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if xcrun simctl list devices available -j > /tmp/available-simulators.json; then
              cat /tmp/available-simulators.json
              exit 0
            fi
            echo "CoreSimulator is not ready (attempt $attempt/3)."
            sleep $((attempt * 10))
          done
          xcodebuild -version
          xcrun simctl list runtimes || true
          exit 1
      - name: Install iOS simulator runtime
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            echo "iOS simulator runtime installation failed (attempt $attempt/3)."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          xcodebuild -version
          xcrun simctl list runtimes || true
          exit 1
      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j > /tmp/available-simulators.json
          simulator_id="$(/usr/bin/python3 -c '
          import json
          with open("/tmp/available-simulators.json") as f:
              data = json.load(f)
          for runtime, devices in data["devices"].items():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found after installing the iOS runtime")
          ')"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          echo "Selected iPhone simulator: $simulator_id"
      - name: Generate project
        run: tuist generate --no-open
      - name: Run unit and UI tests
        run: >-
          xcodebuild test
          -workspace EumShoppingMall.xcworkspace
          -scheme EumShoppingMall
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO
